name: release-build

# Builds the Windows binaries on a SELF-HOSTED runner and attaches them to the
# GitHub release. Deliberately NOT triggered by pull requests: on a public
# repository a self-hosted runner must never execute code from forks. Only tag
# pushes and the manual "Run workflow" button (both owner-controlled) reach it.
#
# One-time runner machine preparation:
#   1. Register the runner: repo Settings -> Actions -> Runners -> New
#      self-hosted runner (Windows x64), install it as a service.
#   2. Provide a dedicated Blender checkout (do NOT point this at your
#      development tree — the workflow resets/cleans it):
#        git clone https://projects.blender.org/blender/blender.git H:\blender-ci
#        git -C H:\blender-ci submodule update --init lib/windows_x64
#      (Tip: copy lib/windows_x64 from an existing checkout to skip the
#      multi-GB download, then let git fix it up.)
#   3. Make sure `cmake`, `git` and Python are on PATH for the runner service,
#      with Visual Studio 2022 installed.
#   4. Optional: set a repository variable BLENDER_CI_TREE to override the
#      default checkout location.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload release assets

env:
  CI_TREE: ${{ vars.BLENDER_CI_TREE || 'H:\blender-ci' }}

jobs:
  build:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        # Windows PowerShell 5.1 — present on every Windows machine; the
        # runner host does not need PowerShell 7 installed.
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 does not fail a multi-line run block when a
      # middle command exits non-zero — only the last command's exit code
      # counts. Check every step explicitly, and verify the final state: a
      # fetch that silently fails under the service account otherwise leaves
      # the tree on the OLD base and the build "succeeds" with stale sources.
      - name: Reset upstream tree to the pinned commit
        run: |
          $pinned = (Get-Content UPSTREAM_COMMIT -Raw).Trim()
          git -C $env:CI_TREE fetch origin
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "fetch failed (exit $LASTEXITCODE); trying local objects"
          }
          git -C $env:CI_TREE checkout --detach $pinned
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $env:CI_TREE reset --hard
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $env:CI_TREE clean -fd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $env:CI_TREE submodule update --init lib/windows_x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $head = (git -C $env:CI_TREE rev-parse HEAD).Trim()
          if ($head -ne $pinned) { Write-Error "tree is at $head, expected $pinned"; exit 1 }

      - name: Assemble tree (overlay + patches)
        run: python scripts/setup.py --blender $env:CI_TREE

      # cmake is not necessarily on the service account's PATH; find the one
      # bundled with Visual Studio / Build Tools.
      # Do not pipe native output into Select-Object -First 1: early pipeline
      # termination closes the pipe while the process may still be writing,
      # which intermittently makes it exit non-zero. Collect first, then index.
      - name: Locate cmake
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $paths = @(& $vswhere -latest -products * `
            -find "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe")
          $cmake = if ($paths.Count -gt 0) { $paths[0] } else { "cmake" }
          "CMAKE=$cmake" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          $banner = @(& $cmake --version)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $banner[0]

      - name: Configure
        run: >
          & "$env:CMAKE" -B "$env:CI_TREE\build" -S "$env:CI_TREE"
          -G "Visual Studio 17 2022" -A x64
          -DWITH_GHOST_WEB=ON -DWITH_WEB_NVENC=ON

      # The build directory persists between runs (incremental rebuilds), so
      # bin\Release accumulates leftovers from older bases: versioned asset
      # directories (a stale "5.2" next to "5.3"), superseded DLLs, files the
      # newer layout moved elsewhere. Start the output directory from scratch —
      # the link step and INSTALL repopulate it, so the zip is exactly the
      # current install set.
      - name: Clean output directory
        run: |
          if (Test-Path "$env:CI_TREE\build\bin\Release") {
            Remove-Item "$env:CI_TREE\build\bin\Release" -Recurse -Force
          }

      - name: Build
        run: '& "$env:CMAKE" --build "$env:CI_TREE\build" --config Release --target INSTALL'

      # Three variants per release, each a superset of the previous: a plain
      # zip; an -mcp zip that adds the Blender MCP addon plus launcher (see
      # tools/blender-mcp/); and a -comfytv zip that further adds the ComfyTV
      # bridge plus launcher (see comfytv-bridge/). Files are copied in AFTER
      # the previous zip is closed, so order matters here.
      - name: Package
        run: |
          $name = $env:GITHUB_SHA.Substring(0, 10)
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $name = $env:GITHUB_REF_NAME }
          $release = "$env:CI_TREE\build\bin\Release"
          Remove-Item "$release\blender_mcp_addon.py", "$release\blender-with-mcp.bat", `
            "$release\blender_comfytv_bridge.py", "$release\blender-for-comfytv.bat" `
            -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$release\*" -DestinationPath "blender-web-$name-windows-x64.zip" -Force
          Copy-Item "tools\blender-mcp\addon.py" "$release\blender_mcp_addon.py" -Force
          Copy-Item "tools\blender-mcp\blender-with-mcp.bat" "$release\" -Force
          Compress-Archive -Path "$release\*" -DestinationPath "blender-web-$name-mcp-windows-x64.zip" -Force
          Copy-Item "comfytv-bridge\blender_comfytv_bridge.py" "$release\" -Force
          Copy-Item "comfytv-bridge\blender-for-comfytv.bat" "$release\" -Force
          Compress-Archive -Path "$release\*" -DestinationPath "blender-web-$name-comfytv-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: blender-web-windows-x64
          path: "*.zip"

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
